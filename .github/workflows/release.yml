# Publie une release (paquet PS5 et, si leur compilation passe, les versions
# macOS et Windows) quand un commit contenant « [release <tag>] » est poussé.
name: release

on:
  push:

permissions:
  contents: write

jobs:
  # Le paquet PS5 dépend de dépôts externes qui ne sont plus publics : s'il ne
  # peut pas être compilé ici, il est ajouté à la main à la release.
  ps5:
    if: contains(github.event.head_commit.message, '[release ')
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Outils
        run: sudo apt-get update && sudo apt-get install -y clang-18 lld-18 llvm-18 python3 zip unzip curl cmake ninja-build
      - name: Build PS5
        run: bash ps5/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ps5
          path: build/ps5/dist/PPSA99731.zip

  macos:
    if: contains(github.event.head_commit.message, '[release ')
    runs-on: macos-14
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances
        run: brew install curl pkg-config ninja cmake dylibbundler
      - name: Build (.app + .dmg)
        run: bash packaging/macos/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/macos/rhythm-ps5-macos-arm64.dmg

  windows:
    if: contains(github.event.head_commit.message, '[release ')
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Outils
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64-posix zip unzip curl
      - name: Build
        run: bash packaging/windows/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/windows/rhythm-ps5-windows.zip

  release:
    needs: [ps5, macos, windows]
    if: always() && contains(github.event.head_commit.message, '[release ')
    runs-on: ubuntu-24.04
    steps:
      - name: Tag
        id: tag
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: echo "name=$(printf '%s' "$MSG" | sed -n 's/.*\[release \([^]]*\)\].*/\1/p' | head -1)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - name: Placer le tag sur ce commit
        run: |
          git tag -f "${{ steps.tag.outputs.name }}" "$GITHUB_SHA"
          git push -f origin "refs/tags/${{ steps.tag.outputs.name }}"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publier
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: rhythm-ps5 ${{ steps.tag.outputs.name }}
          prerelease: true
          body_path: .github/release-notes.md
          files: |
            artifacts/**/*.zip
            artifacts/**/*.dmg
